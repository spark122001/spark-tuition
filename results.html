<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Results – Spark Tuition Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="navbar-placeholder"></div>

<!-- PAGE HERO -->
<section class="page-hero">
  <div class="container position-relative">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html" style="color:rgba(255,255,255,0.5);text-decoration:none;">Home</a></li>
        <li class="breadcrumb-item active">Student Results</li>
      </ol>
    </nav>
    <h1 class="page-hero-title">Student <span>Results</span></h1>
    <p style="color:rgba(255,255,255,0.6);font-size:1rem;max-width:520px;margin-top:1rem;">Our students consistently shine in CBSE and PSEB board examinations, year after year.</p>
  </div>
</section>

<!-- FILE LOAD STATUS -->
<section style="padding:20px 0;background:var(--white);">
  <div class="container">
    <div id="fileStatus" style="font-size:0.9rem;color:var(--gray);display:flex;align-items:center;gap:0.5rem;">
      <span id="statusIcon">⏳</span>
      <span id="statusText">Loading results data…</span>
    </div>
  </div>
</section>

<!-- YEAR FILTER -->
<section style="padding:50px 0 30px;background:var(--white);">
  <div class="container">
    <div class="d-flex gap-2 flex-wrap" id="yearFilter">
      <button class="year-btn active" data-year="all">All Years</button>
    </div>
  </div>
</section>

<style>
.year-btn {
  border: 1px solid var(--border);
  background: white;
  color: var(--gray);
  padding: 6px 18px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.year-btn.active, .year-btn:hover {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.result-year-header {
  background: var(--light);
  border-radius: 12px;
  padding: 1rem 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.result-year-badge {
  background: var(--secondary);
  color: white;
  padding: 4px 14px;
  border-radius: 6px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
}
.class-header {
  background: rgba(67, 97, 238, 0.05);
  border-left: 4px solid var(--primary);
  padding: 0.8rem 1.2rem;
  margin: 1.5rem 0 1rem 0;
  border-radius: 4px;
}
.class-header h6 {
  margin: 0;
  font-weight: 600;
  color: var(--secondary);
  font-size: 0.95rem;
}
.summary-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.summary-card {
  border-radius: 12px;
  padding: 1.2rem;
  text-align: center;
  color: white;
}
.summary-card .value {
  font-family: 'Syne', sans-serif;
  font-size: 2rem;
  font-weight: 800;
}
.summary-card .label {
  font-size: 0.75rem;
  opacity: 0.85;
}
</style>

<!-- TOPPERS SECTION -->
<section style="padding:40px 0 100px;">
  <div class="container">
    <div id="resultsContainer"></div>
  </div>
</section>



<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<!-- SheetJS: primary CDN with unpkg fallback loaded dynamically -->
<script>
  (function loadXLSX(callback) {
    var primary = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    var fallback = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
    function tryLoad(url, onFail) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = callback;
      s.onerror = onFail || function(){};
      document.head.appendChild(s);
    }
    tryLoad(primary, function() { tryLoad(fallback, function() {
      document.getElementById('statusText').textContent =
        'Failed to load XLSX library. Check your internet connection.';
      document.getElementById('statusIcon').textContent = '✗';
    }); });
  })(function() {
    // XLSX is now confirmed available — boot the app
    if (typeof window.__xlsxReady === 'function') window.__xlsxReady();
  });
</script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>

<script>
  // ─────────────────────────────────────────────────────────────
  // CONFIG: Place your Excel file at  files/results.xlsx
  // relative to this HTML file. Rename the constant below if
  // you use a different filename.
  // ─────────────────────────────────────────────────────────────
  const EXCEL_FILE_PATH = 'files/results.xlsx';

  let resultsData = {};

  const colorMap = {
    '1': { bg: 'linear-gradient(135deg,#FF6B2B,#ff8c5a)', text: '#FF6B2B' },
    '2': { bg: 'linear-gradient(135deg,#4361ee,#7209b7)', text: '#4361ee' },
    '3': { bg: 'linear-gradient(135deg,#00C9A7,#009e84)', text: '#00C9A7' },
    '4': { bg: 'linear-gradient(135deg,#f72585,#b5179e)', text: '#f72585' },
    '5': { bg: 'linear-gradient(135deg,#FFD700,#f0b800)', text: '#FFD700' }
  };

  const achievementColors = {
    'District Topper': { bg: 'rgba(255,215,0,0.1)', text: '#B8860B' },
    'State Merit':     { bg: 'rgba(0,201,167,0.1)', text: '#00C9A7' },
    'JEE Qualified':   { bg: 'rgba(67,97,238,0.1)', text: '#4361ee' },
    'NEET Qualified':  { bg: 'rgba(0,201,167,0.1)', text: '#00C9A7' },
    'NEET Aspirant':   { bg: 'rgba(114,9,183,0.1)', text: '#7209b7' },
    'School Topper':   { bg: 'rgba(255,107,43,0.1)', text: '#FF6B2B' },
    'Merit List':      { bg: 'rgba(0,201,167,0.1)', text: '#00C9A7' },
    'District Top 10': { bg: 'rgba(255,107,43,0.1)', text: '#FF6B2B' }
  };

  // ─────────────────────────────────────────────────────────────
  // Auto-load Excel from the local files/ directory on page load
  // NOTE: This requires the page to be served via a web server
  //       (e.g. VS Code Live Server, Python http.server, NGINX).
  //       Opening the HTML directly as a file:// URL will be
  //       blocked by the browser's CORS policy.
  // ─────────────────────────────────────────────────────────────
  async function loadExcelFromServer() {
    setStatus('loading', 'Loading results data…');

    try {
      const response = await fetch(EXCEL_FILE_PATH);

      if (!response.ok) {
        throw new Error(`File not found at "${EXCEL_FILE_PATH}" (HTTP ${response.status}). Make sure the file exists in the files/ folder and you are running a local web server.`);
      }

      const arrayBuffer = await response.arrayBuffer();
      const data        = new Uint8Array(arrayBuffer);
      const workbook    = XLSX.read(data, { type: 'array' });

      resultsData = parseExcelData(workbook);

      if (Object.keys(resultsData).length === 0) {
        throw new Error('No valid data found in the Excel file. Check that your sheet has the required columns (Year, Class, Student Name, Score…).');
      }

      setStatus('ok', `Results loaded successfully from ${EXCEL_FILE_PATH}`);
      populateYearFilter();
      renderResults('all');

    } catch (err) {
      console.error('Excel load error:', err);
      setStatus('error', err.message);
    }
  }

  function setStatus(type, message) {
    const icon = document.getElementById('statusIcon');
    const text = document.getElementById('statusText');
    const colors = { loading: '#888', ok: '#00C9A7', error: '#FF6B2B' };
    const icons  = { loading: '⏳',   ok: '✓',       error: '✗' };
    icon.textContent        = icons[type]  || '•';
    text.textContent        = message;
    text.style.color        = colors[type] || '#888';
    icon.style.color        = colors[type] || '#888';
  }

  // ─────────────────────────────────────────────────────────────
  // Parse workbook → { year: { class: [ student, … ] } }
  // ─────────────────────────────────────────────────────────────
  function parseExcelData(workbook) {
    const results = {};

    workbook.SheetNames.forEach(sheetName => {
      const sheet    = workbook.Sheets[sheetName];
      const jsonData = XLSX.utils.sheet_to_json(sheet);

      jsonData.forEach(row => {
        const year         = String(row.Year  || row.year  || '2024');
        const studentClass = String(row.Class || row.class || 'Class 12');

        if (!results[year])              results[year]              = {};
        if (!results[year][studentClass]) results[year][studentClass] = [];

        results[year][studentClass].push({
          rank        : row.Rank        || row.rank        || results[year][studentClass].length + 1,
          name        : row['Student Name'] || row['Name'] || 'N/A',
          stream      : row.Stream      || row.stream      || row.Board || 'N/A',
          score       : parseFloat(row.Score || row.score || 0),
          achievement : row.Achievement || row.achievement || '',
          location    : row.Location    || row.location    || ''
        });
      });
    });

    // Sort each class by score descending and re-rank
    Object.keys(results).forEach(year => {
      Object.keys(results[year]).forEach(cls => {
        results[year][cls].sort((a, b) => b.score - a.score);
        results[year][cls] = results[year][cls].map((student, index) => ({
          ...student,
          rank: index + 1
        }));
      });
    });

    return results;
  }

  // ─────────────────────────────────────────────────────────────
  // Year filter buttons
  // ─────────────────────────────────────────────────────────────
  function populateYearFilter() {
    const years           = Object.keys(resultsData).sort((a, b) => b - a);
    const filterContainer = document.getElementById('yearFilter');

    filterContainer.innerHTML = '<button class="year-btn active" data-year="all">All Years</button>';

    years.forEach(year => {
      const btn       = document.createElement('button');
      btn.className   = 'year-btn';
      btn.dataset.year = year;
      btn.textContent = year;
      filterContainer.appendChild(btn);
    });

    document.querySelectorAll('.year-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderResults(this.dataset.year);
      });
    });
  }

  // ─────────────────────────────────────────────────────────────
  // Render results table
  // ─────────────────────────────────────────────────────────────
  function renderResults(selectedYear) {
    const container  = document.getElementById('resultsContainer');
    container.innerHTML = '';

    const yearsToShow = selectedYear === 'all'
      ? Object.keys(resultsData).sort((a, b) => b - a)
      : [selectedYear];

    yearsToShow.forEach(year => {
      const yearData = resultsData[year];
      const classes  = Object.keys(yearData).sort();

      const yearBlock       = document.createElement('div');
      yearBlock.className   = 'year-block mb-5';
      yearBlock.dataset.year = year;

      // Summary stats
      let totalStudents = 0, passCount = 0, toppers90 = 0;
      classes.forEach(cls => {
        totalStudents += yearData[cls].length;
        passCount     += yearData[cls].filter(s => s.score >= 35).length;
        toppers90     += yearData[cls].filter(s => s.score >= 90).length;
      });

      // const passRate       = totalStudents > 0 ? Math.round((passCount / totalStudents) * 100) : 0;
      const districtToppers = Object.values(yearData).flat()
        .filter(s => s.achievement && s.achievement.toLowerCase().includes('district topper')).length;

      let html = `
        <div class="result-year-header">
          <span class="result-year-badge">${year}</span>
          <h4 style="margin:0;font-size:1.1rem;">Board Results ${year}–${parseInt(year) + 1}</h4>
         
        </div>

        <div class="summary-cards">
          <div class="summary-card" style="background:linear-gradient(135deg,#1A1A2E,#16213E);">
            <div class="value">${districtToppers}</div>
            <div class="label">District Toppers</div>
          </div>
          <div class="summary-card" style="background:linear-gradient(135deg,#00C9A7,#009e84);">
            <div class="value">${toppers90}</div>
            <div class="label">90%+ Students</div>
          </div>
          // <div class="summary-card" style="background:linear-gradient(135deg,#4361ee,#3a0ca3);">
          //   <div class="value">${totalStudents}</div>
          //   <div class="label">Total Appeared</div>
          // </div>
        </div>
      `;

      classes.forEach(cls => {
        const classStudents = yearData[cls];
        html += `
          <div class="class-header">
            <h6>${cls} Toppers – ${year}</h6>
          </div>
          <div class="table-responsive mb-4">
            <table class="toppers-table table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Student Name</th>
                  <th>${cls.includes('10') ? 'Board' : 'Stream'}</th>
                  <th>Score</th>
                  <th>Performance</th>
                  <th>Achievement</th>
                </tr>
              </thead>
              <tbody>
        `;

        classStudents.slice(0, 10).forEach(student => {
          const colors          = colorMap[student.rank] || colorMap['5'];
          const achievementColor = achievementColors[student.achievement] || { bg: 'rgba(200,200,200,0.1)', text: '#999' };

          html += `
            <tr>
              <td><div class="rank-badge rank-${student.rank > 3 ? 'other' : student.rank}">#${student.rank}</div></td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div class="student-avatar" style="background:${colors.bg};width:36px;height:36px;font-size:0.95rem;margin:0;">
                    ${student.name.charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <div style="font-weight:500;font-size:0.9rem;">${student.name}</div>
                    ${student.location ? `<small style="color:var(--gray);">${student.location}</small>` : ''}
                  </div>
                </div>
              </td>
              <td>${student.stream}</td>
              <td><strong style="color:var(--primary);">${student.score.toFixed(1)}%</strong></td>
              <td>
                <div class="percentage-bar">
                  <div class="percentage-fill" style="width:${student.score}%;"></div>
                </div>
              </td>
              <td>
                ${student.achievement ? `
                  <span style="background:${achievementColor.bg};color:${achievementColor.text};padding:2px 8px;border-radius:4px;font-size:0.75rem;">
                    ${student.achievement}
                  </span>
                ` : '-'}
              </td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
      });

      yearBlock.innerHTML = html;
      container.appendChild(yearBlock);
    });
  }


  // If XLSX already loaded by the time this script runs, go now.
  // Otherwise the loader above will call window.__xlsxReady() once ready.
  function boot() {
    if (typeof XLSX !== 'undefined') {
      loadExcelFromServer();
    } else {
      window.__xlsxReady = loadExcelFromServer;
    }
  }
  boot();
</script>
</body>
</html>
