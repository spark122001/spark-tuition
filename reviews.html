<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student & Parent Reviews | Spark Tuition Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .review-card {
      background: white;
      border-radius: 14px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      height: 100%;
    }

    .review-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .review-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .review-header {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: flex-start;
    }

    .review-meta {
      flex: 1;
    }

    .review-name {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      color: var(--text-dark);
    }

    .review-info {
      font-size: 0.75rem;
      color: var(--gray);
      margin-top: 0.25rem;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: rgba(0, 201, 167, 0.1);
      color: var(--accent2);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .stars {
      font-size: 1rem;
      color: #ffc107;
      letter-spacing: 0.2rem;
      margin-bottom: 0.75rem;
    }

    .review-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-light);
      margin-bottom: 1rem;
    }

    .review-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .review-tag {
      font-size: 0.7rem;
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      background: var(--light-gray);
      color: var(--text-dark);
      font-weight: 500;
    }

    .filter-btn {
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .rating-stat {
      text-align: center;
      padding: 1.5rem;
    }

    .rating-stat-num {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'Syne', sans-serif;
    }

    .rating-stat-label {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    .google-cta {
      background: linear-gradient(135deg, #FF6B2B, #ff8c5a);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: white;
      margin-top: 4rem;
    }

    .google-cta h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .google-cta p {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .google-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      color: var(--primary);
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .google-logo:hover {
      transform: scale(1.05);
    }

    .no-reviews {
      text-align: center;
      padding: 2rem;
      background: var(--light);
      border-radius: 14px;
      color: var(--text-light);
    }

    .redirect-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
    }

    .redirect-spinner {
      border: 4px solid var(--light-gray);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .redirect-text {
      font-size: 1.1rem;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .redirect-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .redirect-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<!-- ========== REDIRECT SECTION ========== -->
<section style="padding: 60px 0;">
  <div class="container">
    <div class="redirect-container">
      <div class="redirect-spinner"></div>
      <p class="redirect-text">
        Redirecting you to Google Reviews...
      </p>
      <p style="font-size: 0.9rem; color: var(--text-light);">
        If you're not redirected automatically,
        <a href="https://share.google/G3Zyj3qutGWqwWaYy" class="redirect-link">click here to leave a review</a>
      </p>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  // Redirect to Google Reviews
  window.location.href = 'https://share.google/G3Zyj3qutGWqwWaYy';
</script>
</body>
</html>
